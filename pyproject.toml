[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrange-rx"
version = "0.2.0"
description = "LAGRANGE Rx: documents -> ontology -> digital twin -> legal, optimal procurement plan (single monorepo package)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ingest = ["PyMuPDF>=1.23", "openpyxl>=3.1", "Pillow>=10", "pypdf>=4", "pdfplumber>=0.11", "opencv-python-headless>=4.8", "pytesseract>=0.3.10"]
engine = []                       # numpy/scipy/pydantic are core dependencies
sim = ["pandas>=2.0", "pyarrow>=14", "reportlab>=4", "Pillow>=10", "openpyxl>=3.1", "PyMuPDF>=1.23"]
dev = ["pytest>=8", "pytest-xdist>=3.5", "hypothesis>=6.100"]

[project.scripts]
lagrange-rx = "lagrange_rx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running statistical/property/generation tests"]
