# Законодательные ограничения для движка LAGRANGE Rx. Единственный источник чисел закона.
# Всё, что помечено assumption: true — допущение команды, подлежит подтверждению юристом.
version: "2026.11.17-draft1"
rules:
  UZ-PKM185-LEGAL-BASE:
    title: "Законная база для правила 15%: Kc × курс ЦБ на дату растаможки + пошлина + сборы (+Pr, если подтверждено)"
    params: {}
  UZ-INV-LEGAL-VS-ECONOMIC-BASE:
    title: "Хедж и фрахт входят в экономическую себестоимость, но не в законную базу"
    params: {}
  UZ-PF13-WHOLESALE-MARKUP:
    title: "Оптовая надбавка не выше 15% к законной базе"
    params:
      max_markup: 0.15
  UZ-3735-P19-CEILING:
    title: "Предельные цены: опт = ЧУН / 1,12; опт по рознице = ЧЧН / 1,12 / 1,20 (без НДС)"
    params:
      vat: 0.12
      retail_markup: 0.20
      formula_tolerance: 0.01
      # допущение: формула п.19 для сверки опубликованного ЧУН: Rn × курс × (1 + надбавка) × (1 + НДС)
      formula_wholesale_markup: 0.15
      assumption: true
  UZ-3735-P20-INDEXATION:
    title: "Индексация потолка: рост Rn в сумах >=3% -> 1 января / 1 июля; >5% -> сразу + задержка"
    params:
      threshold_scheduled: 0.03
      threshold_immediate: 0.05
      index_dates: [[1, 1], [7, 1]]   # (месяц, день)
      lag_days: 30
  UZ-3735-P22-REVISION:
    title: "Пересмотр потолка вниз (скачок)"
    params:
      p_cut: 0.3
      depth_min: 0.10
      depth_max: 0.37
      assumption: true
  UZ-INV-UNIFORM-WAREHOUSE-PRICE:
    title: "Общий склад: единая цена на все упаковки препарата в сценарии"
    params: {}
  UZ-INV-CIP-RATCHET:
    title: "Храповик CIP -> будущий Rn (только этап 2)"
    params:
      assumption: true
