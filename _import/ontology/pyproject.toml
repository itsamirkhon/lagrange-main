[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrange-rx-ingest"
version = "0.1.0"
description = "Local document ingest prototype for LAGRANGE Rx"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "pydantic>=2", "PyMuPDF>=1.23", "openpyxl>=3.1", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"rules" = ["rules/uz_pharma_rules.yaml"]
"config" = ["config/ai.yaml"]
