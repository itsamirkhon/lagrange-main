name: Hackathon simulation and decision evidence

on:
  pull_request:
    paths:
      - ".github/workflows/hackathon-validation.yml"
      - "sim/**"
      - "eval/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-and-ontology:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LAGRANGE_AI_MODE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app, simulator and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-uzb
          python -m pip install --upgrade pip
          pip install -e ".[ingest,sim,dev]"
      - name: Test independent synthetic world, ontology boundary and clean-document chain
        run: python -m pytest tests/sim tests/e2e/test_e2e_L0.py tests/test_boundaries.py -q
      - name: Check simulator corruption quality gate
        run: python -m sim.tools.ub_quality_gate

  quantitative-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LAGRANGE_AI_MODE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator and simulation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,sim,dev]"
      - name: Recompute engine metrics from current commit
        run: |
          python -m eval.engine_eval --out "$RUNNER_TEMP/fresh-engine-report.json"
      - name: Upload fresh evaluation, even when thresholds fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation-fresh
          path: ${{ runner.temp }}/fresh-engine-report.json
          if-no-files-found: warn
