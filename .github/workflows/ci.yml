name: LAGRANGE Rx validation
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: UI and Python syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS and Python syntax
        run: |
          node --check web/app.js
          python -m compileall -q src eval tests scripts
      - name: Evidence state (informational, not certification)
        run: python scripts/verify_release.py

  browser:
    name: Real browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[ingest,dev]'
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Chromium desktop and mobile
        run: python scripts/browser_smoke.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: evidence/review_browser/
          if-no-files-found: ignore
