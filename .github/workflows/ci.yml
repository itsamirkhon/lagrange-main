name: Verify LAGRANGE Rx

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ingest,sim,dev]" pytest-xdist

      - name: Run automated tests (parallel, excluding slow/sim-eval)
        run: pytest -n auto -m "not slow" --ignore=tests/sim -k "not test_run_on_simulation_small"
