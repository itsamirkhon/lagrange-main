name: Pharmaceutical quality controls
on:
  pull_request:
    paths:
      - '.github/workflows/pharma-quality.yml'
      - 'src/lagrange_rx/ontology/**'
      - 'src/lagrange_rx/engine/adapter.py'
      - 'src/lagrange_rx/engine/pharma_quality.py'
      - 'tests/engine/test_pharma_quality.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q -e '.[ingest,sim,dev]'
      - name: Pharmaceutical safeguards and existing adapter tests
        run: python -m pytest tests/engine/test_pharma_quality.py tests/engine/test_adapter.py tests/engine/test_adapter_ingest_l0.py -q
