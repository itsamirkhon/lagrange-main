name: Judge demo acceptance

on:
  pull_request:
    paths:
      - "tests/e2e/test_judge_demo.py"
      - ".github/workflows/judge-demo.yml"
      - "scripts/prepare_demo.py"
      - "src/lagrange_rx/api/**"
      - "src/lagrange_rx/engine/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepared-l0-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-uzb
          python -m pip install -q -e ".[ingest,sim,dev]"
      - name: Install Chromium for real browser rehearsal
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Execute actual prepared-company demo contract
        run: python -m pytest tests/e2e/test_judge_demo.py -q -vv
      - name: Rehearse real presenter clicks in Chromium
        run: python scripts/judge_demo_browser.py
      - name: Preserve rehearsal screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-demo-rehearsal
          path: evidence/judge_browser/
          if-no-files-found: warn

  real-browser-judge-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and application dependencies
        run: |
          python -m pip install -q -e ".[ingest,sim,dev]"
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Rehearse real Russian UI through twin, plan, FX shock and evidence
        run: python scripts/judge_browser_smoke.py
      - name: Attach actual demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-browser-rehearsal
          path: evidence/judge_browser/
          if-no-files-found: warn
